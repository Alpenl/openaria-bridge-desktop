<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YLX 传输</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="identity">
        <span class="product-mark">YLX</span>
        <h1>数据传输</h1>
      </div>
      <div class="header-status">
        <span id="health" class="status" aria-live="polite">正在连接</span>
        <button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新">↻</button>
      </div>
    </header>

    <div id="message" class="message" role="status" hidden></div>

    <section class="command-bar" aria-label="主要操作">
      <div class="commands">
        <button type="button" data-open="device-dialog">连接设备</button>
        <button type="button" data-open="media-dialog">扫描介质</button>
        <button type="button" class="secondary" data-open="transfer-dialog">新建传输</button>
      </div>
      <dl class="metrics" aria-label="数据概览">
        <div><dt>在线来源</dt><dd id="metric-sources">0</dd></div>
        <div><dt>本地会话</dt><dd id="metric-sessions">0</dd></div>
        <div><dt>进行中</dt><dd id="metric-tasks">0</dd></div>
      </dl>
    </section>

    <nav class="tabs" role="tablist" aria-label="数据视图">
      <button id="tab-sources" role="tab" aria-selected="true" aria-controls="panel-sources" data-tab="sources">来源</button>
      <button id="tab-local" role="tab" aria-selected="false" aria-controls="panel-local" data-tab="local">本地会话</button>
      <button id="tab-tasks" role="tab" aria-selected="false" aria-controls="panel-tasks" data-tab="tasks">任务</button>
    </nav>

    <main>
      <section id="panel-sources" class="tab-panel" role="tabpanel" aria-labelledby="tab-sources">
        <header class="section-heading">
          <h2>来源</h2>
          <span id="source-count" class="count">0</span>
        </header>
        <div class="table-scroll">
          <table>
            <thead><tr><th>名称</th><th>类型</th><th>身份</th><th>位置</th><th>状态</th></tr></thead>
            <tbody id="source-rows"></tbody>
          </table>
        </div>

        <header class="section-heading subheading">
          <h2>来源会话</h2>
          <span id="source-session-count" class="count">0</span>
        </header>
        <div class="table-scroll">
          <table>
            <thead><tr><th>会话</th><th>来源</th><th>开始时间</th><th>状态</th><th class="action-column">操作</th></tr></thead>
            <tbody id="source-session-rows"></tbody>
          </table>
        </div>
      </section>

      <section id="panel-local" class="tab-panel" role="tabpanel" aria-labelledby="tab-local" hidden>
        <header class="section-heading">
          <h2>本地会话</h2>
          <span id="local-count" class="count">0</span>
        </header>
        <div class="table-scroll">
          <table>
            <thead><tr><th>会话</th><th>修订</th><th>大小</th><th>导入时间</th><th>路径</th><th class="action-column">操作</th></tr></thead>
            <tbody id="local-rows"></tbody>
          </table>
        </div>
      </section>

      <section id="panel-tasks" class="tab-panel" role="tabpanel" aria-labelledby="tab-tasks" hidden>
        <header class="section-heading">
          <h2>任务</h2>
          <span id="task-count" class="count">0</span>
        </header>
        <div class="table-scroll">
          <table class="task-table">
            <thead><tr><th>任务</th><th>状态</th><th>进度</th><th>结果</th><th class="action-column">操作</th></tr></thead>
            <tbody id="task-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="device-dialog">
      <form id="device-form">
        <header><h2>连接设备</h2><button type="button" class="icon-button" data-close aria-label="关闭" title="关闭">×</button></header>
        <div class="form-grid">
          <label class="wide">设备地址<input name="endpoint" type="url" required placeholder="https://192.168.1.10" /></label>
          <label class="wide">凭据引用<input name="credential_ref" autocomplete="off" placeholder="device-a" /></label>
          <label>Pin 目标<input name="tls_pin_target" value="leaf-certificate-der" /></label>
          <label>Pin 算法<input name="tls_pin_algorithm" value="sha256" /></label>
          <label>Pin 编码<input name="tls_pin_encoding" value="lowercase-hex" /></label>
          <label>Pin 值<input name="tls_pin_value" pattern="[0-9a-f]{64}" autocomplete="off" /></label>
        </div>
        <footer><button type="button" class="secondary" data-close>取消</button><button type="submit">连接</button></footer>
      </form>
    </dialog>

    <dialog id="media-dialog">
      <form id="media-form">
        <header><h2>扫描介质</h2><button type="button" class="icon-button" data-close aria-label="关闭" title="关闭">×</button></header>
        <label>挂载路径<input name="path" required placeholder="/media/user/YLX" /></label>
        <footer><button type="button" class="secondary" data-close>取消</button><button type="submit">扫描</button></footer>
      </form>
    </dialog>

    <dialog id="transfer-dialog">
      <form id="transfer-form">
        <header><h2>新建传输</h2><button type="button" class="icon-button" data-close aria-label="关闭" title="关闭">×</button></header>
        <div class="form-grid">
          <label>方向<select name="direction"><option value="download">下载</option><option value="upload">上传</option></select></label>
          <label>对象大小<input name="total_size" type="number" min="0" required /></label>
          <label class="wide">远端地址<input name="endpoint" type="url" required /></label>
          <label class="wide">本地路径<input name="local_path" required /></label>
          <label class="wide">SHA-256<input name="expected_sha256" pattern="[0-9a-f]{64}" required /></label>
          <label>凭据引用<input name="credential_ref" /></label>
          <label>分段大小<input name="chunk_size" type="number" min="1" value="4194304" required /></label>
          <label class="wide">发布地址<input name="publish_url" type="url" /></label>
        </div>
        <footer><button type="button" class="secondary" data-close>取消</button><button type="submit">创建</button></footer>
      </form>
    </dialog>

    <dialog id="publication-dialog">
      <form id="publication-form">
        <header><h2>发布会话</h2><button type="button" class="icon-button" data-close aria-label="关闭" title="关闭">×</button></header>
        <input id="publication-local-session-id" name="local_session_id" type="hidden" />
        <div class="form-grid">
          <label class="wide">S3 地址<input name="endpoint_url" type="url" placeholder="https://s3.example.com" /></label>
          <label>Bucket<input name="bucket" required /></label>
          <label>Region<input name="region_name" /></label>
          <label class="wide">Raw prefix<input name="raw_prefix" value="raw/" required /></label>
          <label class="wide">凭据引用<input name="credential_ref" /></label>
        </div>
        <footer><button type="button" class="secondary" data-close>取消</button><button type="submit">发布</button></footer>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
