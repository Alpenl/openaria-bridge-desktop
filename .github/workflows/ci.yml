name: CI / Release

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Semantic-version tag to create/update after a successful release
          build. Leave empty to run CI against the selected branch without
          publishing a release.
        required: false
        default: ""
        type: string
permissions:
  contents: read

# One in-flight run per ref. A superseded push has nothing useful left to
# say, and letting it finish only delays the run that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: resolve build metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checkout_ref: ${{ steps.metadata.outputs.checkout_ref }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      platforms: ${{ steps.metadata.outputs.platforms }}
    steps:
      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          checkout_ref="${GITHUB_REF}"
          release_tag=""

          # A dispatch without a tag is a plain manual CI run against the
          # selected ref. A dispatch with a tag publishes the selected ref and
          # creates the tag later if it does not already exist.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${REQUESTED_TAG}" ]]; then
            release_tag="${REQUESTED_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -n "${release_tag}" && ! "${release_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the numeric SemVer form X.Y.Z; got '${release_tag}'." >&2
            exit 1
          fi

          is_release=false
          if [[ -n "${release_tag}" ]]; then
            is_release=true
          fi

          # Desktop application releases are Windows-only. Linux still runs the
          # normal frontend/Rust validation jobs above; installer packaging and
          # app-update artifacts are produced only by the Windows runner.
          platforms='["windows-latest"]'

          {
            echo "checkout_ref=${checkout_ref}"
            echo "is_release=${is_release}"
            echo "release_tag=${release_tag}"
            echo "platforms=${platforms}"
          } >> "${GITHUB_OUTPUT}"

  frontend:
    name: frontend (lint, typecheck, build)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Rust checks for the single Cargo workspace. The root manifest owns the
  # application, core crate, and adapter crate, so one all-targets/all-features
  # gate covers production and test code together.
  rust:
    name: rust (fmt, clippy, test)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      # The outer crate links against the system webkit/gtk stack, so even
      # `cargo clippy` on it needs these present.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features

  object-store-minio:
    name: hermetic object-store contract (MinIO)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the pinned MinIO contract lane
        env:
          YLX_MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        run: bash src-tauri/crates/ylx-transfer-adapters/tests/support/run_minio_object_store_contract.sh

  fs-recovery:
    name: filesystem recovery (${{ matrix.os }})
    needs: prepare
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run filesystem recovery contract
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          -p ylx-transfer-core --test fs_recovery_contract
          --all-targets --all-features -- --nocapture

  # Builds the shipped desktop app. The product release surface is Windows-only,
  # so this job no longer packages macOS/Linux applications.
  tauri:
    name: tauri build (${{ matrix.platform }})
    needs: [prepare, frontend, rust]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set bundle version from Release tag
        if: needs.prepare.outputs.is_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_tag }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.version = process.env.RELEASE_VERSION;
          config.bundle = config.bundle ?? {};
          config.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Prepare Windows ffmpeg sidecar
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $ffmpeg src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version

      - name: Enable Windows ffmpeg sidecar
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.bundle = config.bundle ?? {};
          config.bundle.externalBin = ["binaries/ffmpeg"];
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      # Formatting is platform-independent and already gated by the `rust`
      # job; clippy and all-target tests are not -- cfg-gated paths differ per
      # OS, which is the whole point of running this matrix.
      - name: cargo clippy
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features -- -D warnings

      - name: Rust workspace tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features

      - name: tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.is_release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ylx-transfer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/ylx-transfer
            src-tauri/target/release/ylx-transfer.exe

  release:
    name: publish GitHub Release
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ylx-transfer-*
          path: release-assets

      - name: Create Release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          head_commit="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "Release tag ${RELEASE_TAG} already exists at ${tag_commit}, but this build checked out ${head_commit}." >&2
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "${head_commit}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          release_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(
            find release-assets -type f \
              \( -name '*.msi' \
                -o -name '*-setup.exe' \
                -o -name '*.zip' \
                -o -name '*.sig' \) \
              -print0 | sort -z
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No packaged desktop installers were found in the build artifacts." >&2
            exit 1
          fi

          node - "${RELEASE_TAG}" "${release_url}" release-assets <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const [, , version, releaseUrl, root] = process.argv;
          const osByRunner = new Map([
            ["windows-latest", "windows"],
          ]);
          const archByRunner = new Map([
            ["windows-latest", "x86_64"],
          ]);

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const files = walk(root);
          const platforms = {};
          for (const file of files) {
            if (!fs.existsSync(`${file}.sig`)) continue;
            const parts = file.split(path.sep);
            const runner = [...osByRunner.keys()].find((name) => parts.includes(`ylx-transfer-${name}`));
            if (runner === undefined) continue;
            const platform = `${osByRunner.get(runner)}-${archByRunner.get(runner)}`;
            // GitHub Release download asset names replace spaces with dots.
            // Generate updater URLs from that canonical asset spelling rather
            // than the local bundle filename emitted by Tauri.
            const assetName = path.basename(file).replaceAll(" ", ".");
            platforms[platform] = {
              signature: fs.readFileSync(`${file}.sig`, "utf8").trim(),
              url: `${releaseUrl}/${encodeURIComponent(assetName)}`,
            };
          }

          if (Object.keys(platforms).length === 0) {
            console.error("No updater artifacts with .sig sidecars were found.");
            process.exit(1);
          }

          for (const required of ["windows-x86_64"]) {
            if (platforms[required] === undefined) {
              console.error(`Missing updater manifest entry for ${required}.`);
              process.exit(1);
            }
          }

          const manifest = {
            version,
            notes: `Open Aria Bridge ${version}`,
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          assets+=("latest.json")

          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --generate-notes \
              --title "Release ${RELEASE_TAG}" \
              --verify-tag
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --prerelease=false \
            --title "Release ${RELEASE_TAG}"
