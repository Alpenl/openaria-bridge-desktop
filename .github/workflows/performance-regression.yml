name: Session refresh performance regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-refresh:
    name: session refresh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Verify deterministic performance contracts
        shell: bash
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          -p ylx-transfer-core --release --features performance-benchmark
          --test session_refresh_performance_contract
          --test session_refresh_benchmark_cli
      - name: Run fixed Score 32 benchmark and enforce the 5x gate
        shell: bash
        run: >-
          cargo run --manifest-path src-tauri/Cargo.toml
          -p ylx-transfer-core --release --features performance-benchmark
          --bin session-refresh-benchmark --
          --warmup 2 --samples 11
          --source-commit "${{ github.sha }}"
          --output "performance-results/session-refresh-${{ runner.os }}-${{ runner.arch }}.json"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: session-refresh-performance-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: performance-results
